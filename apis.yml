name: Altruist (iConnectiva)
description: 'iConnectiva (Connectiva Analytics and Insights Ltd), part of Altruist
  Technologies Pvt. Ltd., is a telecom analytics product and services company focused
  on subscriber-data monetization. Its RAFMS platform delivers Revenue Assurance and
  Fraud Management to telecom, media and utility operators, alongside Big Data analytics
  to lower churn, boost ARPU and reduce revenue leakage. iConnectiva reports managing
  350+ million subscribers for Revenue Assurance and Fraud Management, handling 500+
  million customers, processing 15+ billion CDR/day, a repository of 400+ KPIs across
  RA and FMS, and 1000+ adaptors, delivered through advisory, tool-based and managed
  services. No public API, developer portal, or SDK surface is published.'
